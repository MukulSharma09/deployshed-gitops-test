apiVersion: v1
kind: Service
metadata:
  name: gitops-web
  {{- if .Values.url }}
  annotations:
    # ArgoCD reports this as the Application's address; deployshed shows it.
    link.argocd.argoproj.io/external-link: {{ .Values.url | quote }}
  {{- end }}
spec:
  type: LoadBalancer
  selector: {app: gitops-web}
  ports: [{port: 80, targetPort: 80}]
